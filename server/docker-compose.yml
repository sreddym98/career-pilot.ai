services:
  db:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_PASSWORD: dev, POSTGRES_DB: careerpilot}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    volumes: [./api:/app/api, ./ingest:/app/ingest]
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
volumes: {pgdata:}
