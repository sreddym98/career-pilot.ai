# ═══════════════════════════════════════════════════════════════════
# ATS company slugs — the job pipeline's source of truth.
#
# Each entry is polled daily at a public, auth-free endpoint:
#   greenhouse  https://boards-api.greenhouse.io/v1/boards/{slug}/jobs?content=true
#   lever       https://api.lever.co/v0/postings/{slug}?mode=json
#   ashby       https://api.ashbyhq.com/posting-api/job-board/{slug}
#
# IMPORTANT — verify before trusting:
#   python ingest/verify_slugs.py --fix
#
# Companies migrate between ATS vendors and change their slug. Expect
# 10-20% of any curated list to be stale on day one. The verifier probes
# every entry, reports job counts, and moves dead ones to a `retired`
# section rather than deleting them (so you don't re-add them later).
#
# Coverage note: Fortune 500 companies mostly run Workday, which has no
# clean public API. You will get those through the aggregator leg
# (JSearch), not from this file. This file is where the tech employers
# with modern ATS setups live — and they're the ones hiring SDETs.
# ═══════════════════════════════════════════════════════════════════

