<style>

<script>
(function(){
"use strict";
var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;

var TYPE={Column:{c:0x2F6B3C,l:"Columns"},Beam:{c:0xD2561F,l:"Beams"},Slab:{c:0x5E86A8,l:"Slabs"},WallStandardCase:{c:0xC8B48C,l:"Walls"},BuildingElementProxy:{c:0x8A6D2F,l:"Other elements"}};

/* ── renderer / scene ── */
var cv=$("gl"),R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:false});

var sun=new THREE.DirectionalLight(0xffffff,.75);sun.position.set(14,22,10);S.add(sun);

/* ── orbit (own implementation: no extra libraries) ── */

cv.addEventListener("pointerdown",function(e){cv.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,pan:e.button===2||e.shiftKey,moved:false};auto=false;goal=null});

  if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>4)drag.moved=true;
  if(drag.pan){var k=sph.r*.0012,r=new THREE.Vector3().setFromMatrixColumn(cam.matrix,0),u=new THREE.Vector3().setFromMatrixColumn(cam.matrix,1);tgt.addScaledVector(r,-dx*k).addScaledVector(u,dy*k)}

var pin=null;cv.addEventListener("touchstart",function(e){if(e.touches.length===2)pin=dist(e)},{passive:true});

function dist(e){var a=e.touches[0],b=e.touches[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}

/* ── picking ── */
var ray=new THREE.Raycaster(),ndc=new THREE.Vector2();

  var hits=ray.intersectObjects(EL.filter(function(x){return x.mesh.visible}).map(function(x){return x.mesh}),false),h=null;
  for(var i=0;i<hits.length;i++){if(hits[i].point.y<=clip.constant+.001||clip.constant>=99){h=hits[i].object.userData.el;break}}

  select(h)}
function select(el){selected=el;paint();inspect(el)}

/* ── load ── */
var RATE=20;
var INL=window.__BIM_INLINE;
function b64buf(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
Promise.all(INL?[Promise.resolve(INL.json),Promise.resolve(b64buf(INL.bin))]:[fetch("models/structure.json").then(function(r){return r.json()}),fetch("models/structure.bin").then(function(r){return r.arrayBuffer()})]).then(function(a){
  META=a[0];var buf=a[1],nv=META.vertexFloats,V=new Float32Array(buf,0,nv),I=new Uint32Array(buf,nv*4);
  var box=new THREE.Box3();
  META.elements.forEach(function(e){
    var pos=V.slice(e.vOff*6,(e.vOff+e.vCount)*6),ix=new Uint32Array(e.iCount);
    for(var k=0;k<e.iCount;k++)ix[k]=I[e.iOff+k]-e.vOff;
    var P=new Float32Array(e.vCount*3),N=new Float32Array(e.vCount*3);
    for(var v=0;v<e.vCount;v++){P.set([pos[v*6],pos[v*6+1],pos[v*6+2]],v*3);N.set([pos[v*6+3],pos[v*6+4],pos[v*6+5]],v*3)}
    var g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(P,3));g.setAttribute("normal",new THREE.BufferAttribute(N,3));g.setIndex(new THREE.BufferAttribute(ix,1));
    var mat=new THREE.MeshStandardMaterial({color:(TYPE[e.type.replace(/^Ifc/,"")]||{c:0x999999}).c,roughness:.85,metalness:0,side:THREE.DoubleSide,clippingPlanes:[clip]});
    var mesh=new THREE.Mesh(g,mat);
    var ed=new THREE.LineSegments(new THREE.EdgesGeometry(g,28),new THREE.LineBasicMaterial({color:0x1E211C,transparent:true,opacity:.28,clippingPlanes:[clip]}));
    mesh.add(ed);
    var t=e.type.replace(/^Ifc/,""),o={e:e,t:t,mesh:mesh,edge:ed,mat:mat,vol:volume(P,ix),base:mat.color.clone(),step:0};
    mesh.userData.el=o;EL.push(o);GROUP.add(mesh);box.expandByObject(mesh)});
  S.add(GROUP);
  var c=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3());
  GROUP.position.sub(c);tgt.set(0,0,0);H=sz.y;W=Math.max(sz.x,sz.z);
  clip.constant=sz.y/2+.01;CLIPMAX=sz.y/2+.01;CLIPMIN=-sz.y/2;
  var g=new THREE.GridHelper(Math.max(60,W*2),Math.round(Math.max(60,W*2)/2),0xC3D4C2,0xE5E2D8);g.position.y=-sz.y/2-.02;S.add(g);
  buildSteps();
  var rad=sz.length()/2,fv=cam.fov*Math.PI/180,fh=2*Math.atan(Math.tan(fv/2)*cam.aspect),fit=rad/Math.sin(Math.min(fv,fh)/2)*.58;
  sph.r=fit*2.3;sph.th=2.3;sph.ph=.6;goal={r:fit,th:.75,ph:1.12,t:0,d:RM?0:3400};if(RM){sph.r=goal.r;sph.th=goal.th;sph.ph=goal.ph;goal=null}
  idleAt=performance.now();place();tabs("3d");$("load").classList.add("done");
  $("foot").textContent="Model: "+META.source+". Every value shown is read from the IFC file.";
}).catch(function(e){$("load").innerHTML="<div><div class='brand' style='justify-content:center'>careerpilot<em>.ai</em></div><p style='color:#9B4B42'>Could not load the model files ("+esc(e.message||e)+").</p></div>"});
var H=1,W=1,CLIPMAX=1,CLIPMIN=0;

function volume(P,ix){var s=0;for(var i=0;i<ix.length;i+=3){var a=ix[i]*3,b=ix[i+1]*3,c=ix[i+2]*3;
  s+=(P[a]*(P[b+1]*P[c+2]-P[b+2]*P[c+1])-P[a+1]*(P[b]*P[c+2]-P[b+2]*P[c])+P[a+2]*(P[b]*P[c+1]-P[b+1]*P[c]))/6}return Math.abs(s)}

/* 4D: an ordering derived from level and element type (the file holds no schedule) */
var STEPS=[];
function buildSteps(){
  var st=[...new Set(EL.map(function(x){return x.e.storey||""}))].sort(),keys={};
  EL.forEach(function(o){var k=st.indexOf(o.e.storey||"")*10+(RANK[o.t]==null?5:RANK[o.t]);keys[k]=1;o.key=k});
  STEPS=Object.keys(keys).map(Number).sort(function(a,b){return a-b});
  EL.forEach(function(o){o.step=STEPS.indexOf(o.key)+1});
  stepMax=STEPS.length;var s=$("step");s.max=stepMax;s.value=stepMax;
  STEPS=STEPS.map(function(k){var si=Math.floor(k/10),r=k%10,ty=Object.keys(RANK).filter(function(t){return RANK[t]===r})[0]||"Other";return{lv:st[si]||"",t:ty}})}

/* ── painting by mode ── */
var VOLMAX=1,UMIN=0,UMAX=1;
function uval(o){var ps=o.e.psets,k=Object.keys(ps);for(var i=0;i<k.length;i++){var v=ps[k[i]].ThermalTransmittance;if(typeof v==="number")return v}return null}

function paint(){
  var cur=+$("step").value;
  EL.forEach(function(o){
    var vis=!hidden[o.t],col=o.base.clone(),op=1;
    if(mode==="4d"){vis=vis&&o.step<=cur;if(o.step===cur)col=new THREE.Color(0x4C6B4F).lerp(new THREE.Color(0xffffff),.15)}
    else if(mode==="5d"){col=ramp(Math.sqrt(o.vol/VOLMAX))}
    else if(mode==="6d"){var u=uval(o);col=u==null?new THREE.Color(0xE5E2D8):ramp((u-UMIN)/Math.max(1e-6,UMAX-UMIN))}
    else if(mode==="7d"){}
    if(o===selected)col=new THREE.Color(0xC9A227);else if(o===hover&&false)col=col.lerp(new THREE.Color(0xffffff),.3);
    o.mat.color.copy(col);var seeThru=mode==='3d'&&o.t==='WallStandardCase'&&o!==selected;o.mat.transparent=seeThru;o.mat.opacity=seeThru?.3:1;o.mat.depthWrite=!seeThru;o.mesh.visible=vis;
  });
  if(mode==="7d")document.querySelectorAll("tr.pick").forEach(function(r){r.classList.toggle("sel",selected&&+r.dataset.id===selected.e.id)})}

/* ── inspector: only what is in the file ── */
function inspect(o){
  var p=$("insp");if(!o){p.classList.add("off");return}
  var e=o.e,ps=Object.keys(e.psets).map(function(n){var kv=Object.keys(e.psets[n]).map(function(k){var v=e.psets[n][k];if(typeof v==="number")v=Math.round(v*1000)/1000;return "<span>"+esc(k)+"</span><span>"+esc(v===true?"Yes":v===false?"No":v)+"</span>"}).join("");return "<div class='ps'><h4>"+esc(n)+"</h4><div class='kv'>"+kv+"</div></div>"}).join("");
  p.innerHTML="<div class='ty'>"+esc(e.type.toUpperCase())+"</div><h2>"+esc(e.name||"(unnamed)")+"</h2><div class='kv'><span>Level</span><span>"+esc(e.storey||"—")+"</span><span>Material</span><span>"+esc(e.material||"—")+"</span><span>Tag</span><span>"+esc(e.tag||"—")+"</span><span>Volume (from geometry)</span><span>"+o.vol.toFixed(3)+" m³</span></div>"+ps+"<div class='row'><button class='btn' id='xc'>Close</button></div>";
  p.classList.remove("off");$("xc").onclick=function(){select(null)}}

/* ── modes ── */
function counts(){var c={};EL.forEach(function(o){var k=o.t;c[k]=c[k]||{n:0,v:0};c[k].n++;c[k].v+=o.vol});return c}
function tabs(m){
  mode=m;document.querySelectorAll("#tabs button").forEach(function(b){b.classList.toggle("on",b.dataset.m===m)});
  VOLMAX=Math.max.apply(null,EL.map(function(o){return o.vol}))||1;
