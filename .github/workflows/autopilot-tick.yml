name: Autopilot tick

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

concurrency:
  group: autopilot-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: ${{ secrets.API_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check secrets
        run: |
          missing=""
          [ -z "$API_URL" ] && missing="$missing API_URL"
          [ -z "$CRON_SECRET" ] && missing="$missing CRON_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secret(s):$missing. Add them under Settings > Secrets and variables > Actions (see docs/DEPLOY_PRODUCTION.md)."
            exit 1
          fi
      - name: Warm the service (Render free tier sleeps)
        run: |
          curl -sS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 \
            "${API_URL%/}/health" || echo "warm-up did not answer; continuing"
      - name: Trigger autopilot tick
        run: |
          curl -fsS -X POST \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            --retry 3 --retry-delay 20 --max-time 120 \
            "${API_URL%/}/api/autopilot/tick" \
            || { echo "::error::Autopilot tick failed. Check API_URL, that CRON_SECRET matches Render, and the Render logs."; exit 1; }
