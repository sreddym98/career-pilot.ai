<!DOCTYPE html><html><meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
<body>
<header>
  <div class="logo"><svg viewBox="0 0 32 32" aria-hidden="true">
    <defs><linearGradient id="cpg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FA87C"/><stop offset="1" stop-color="#3D5940"/></linearGradient></defs>
    <path d="M16 3 L27 26 L16 20 L5 26 Z" fill="url(#cpg)"/>
    <path d="M16 3 L16 20 L5 26 Z" fill="#fff" opacity=".22"/>
  </svg></div>
  <div><b>CareerPilot AI</b><span id="ats">checking page…</span></div>
</header>

<main>
  <div id="who"></div>
  <div id="state"></div>
  <button id="fill" class="primary" disabled>Fill this form</button>
  <div id="result"></div>
</main>

<footer>
  <div class="note">Never submits for you. Salary, sponsorship, and demographic
  questions are always left for you to answer.</div>
  <a href="#" id="settings">Settings</a>
</footer>

<div id="panel" hidden>
  <label>API address</label>
  <input id="apiBase" placeholder="leave blank to detect automatically">
  <div class="hint">Signing in at careerpilot.ai connects this extension on its
  own. There is nothing to paste here.</div>
  <button id="save" class="primary">Save</button>
</div>
<script src="popup.js"></script>
</body></html>
